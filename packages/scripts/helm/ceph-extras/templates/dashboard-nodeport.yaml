{{- if .Values.dashboardEnabled }}
# NodePort in front of the ceph-mgr dashboard so it's reachable from the host
# without `kubectl port-forward` (kind maps this NodePort to a host port). Only
# rendered when ceph.dashboard.enabled. The dashboard serves HTTPS (self-signed)
# on 8443 in the single mgr pod; app=rook-ceph-mgr uniquely selects it since
# mgr.count is 1.
apiVersion: v1
kind: Service
metadata:
  name: rook-ceph-mgr-dashboard-nodeport
  namespace: {{ .Values.namespace }}
  labels:
    app: rook-ceph-mgr
spec:
  type: NodePort
  selector:
    app: rook-ceph-mgr
  ports:
    - name: https-dashboard
      protocol: TCP
      port: 8443
      targetPort: 8443
      nodePort: {{ .Values.dashboardNodePort }}
{{- end }}

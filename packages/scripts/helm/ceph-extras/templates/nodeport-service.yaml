# Rook creates a ClusterIP service for the RGW; this adds a NodePort in front of
# the same pods so the S3 endpoint is reachable from the host machine (kind maps
# this NodePort to host CEPH_PORT). In-cluster consumers can keep using the
# service DNS rook-ceph-rgw-<store>.<ns>.svc.cluster.local instead.
apiVersion: v1
kind: Service
metadata:
  name: rook-ceph-rgw-{{ .Values.storeName }}-nodeport
  namespace: {{ .Values.namespace }}
  labels:
    app: rook-ceph-rgw
    rook_object_store: {{ .Values.storeName }}
spec:
  type: NodePort
  selector:
    app: rook-ceph-rgw
    rook_object_store: {{ .Values.storeName }}
  ports:
    - name: s3
      protocol: TCP
      port: {{ .Values.rgwPort }}
      # targetPort must be the RGW container port, NOT the service port, or the
      # NodePort routes to nothing. Rook maps these asymmetrically: the plain port
      # (gateway.port 80) lands on container 8080, but the secure port is served on
      # gateway.securePort itself (443 -> 443, see Rook's generateService). When TLS
      # is on the host-facing S3 client (and the e2e assets-spec) connect over https.
      {{- if .Values.tlsEnabled }}
      targetPort: 443
      {{- else }}
      targetPort: 8080
      {{- end }}
      nodePort: {{ .Values.nodePort }}

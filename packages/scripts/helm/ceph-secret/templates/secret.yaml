# Rook's CephObjectStore sslCertificateRef expects an opaque secret with a "cert"
# key holding the key + cert PEM (beast's ssl_certificate=/ssl_private_key=).
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secretName }}
  namespace: {{ .Values.namespace }}
type: Opaque
stringData:
  cert: {{ .Values.keypair | replace "\\n" "\n" | quote }}

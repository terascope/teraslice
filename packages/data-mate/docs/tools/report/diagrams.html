<!-- DIAGRAM 1: the flow, and where the decision sits -->
<figure class="fig">
<svg viewBox="0 0 900 260" role="img" aria-label="Elasticsearch feeds qpl-search-api, which coerces records once and returns Parquet+zstd over the wire to qpl-worker, where the storage decision is made and all queries and joins run." xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <polygon points="0,0 10,5 0,10" fill="currentColor"/>
    </marker>
    <marker id="ar-hot" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <polygon points="0,0 10,5 0,10" fill="var(--accent)"/>
    </marker>
  </defs>

  <!-- Elasticsearch -->
  <rect x="8" y="86" width="104" height="52" rx="4" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.55"/>
  <text x="60" y="108" text-anchor="middle" font-size="12" fill="currentColor">Elasticsearch</text>
  <text x="60" y="124" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.6">parsed JS objects</text>

  <line x1="112" y1="112" x2="168" y2="112" stroke="currentColor" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- producer -->
  <rect x="170" y="44" width="220" height="136" rx="5" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <text x="280" y="34" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.65" letter-spacing="0.08em">PRODUCER</text>
  <text x="280" y="68" text-anchor="middle" font-size="13" font-weight="600" fill="currentColor">qpl-search-api</text>
  <text x="280" y="90" text-anchor="middle" font-size="10.5" fill="currentColor" opacity="0.75">stateless · distributed</text>
  <text x="280" y="108" text-anchor="middle" font-size="10.5" fill="currentColor" opacity="0.75">≤ 100k records per slice</text>
  <line x1="192" y1="120" x2="368" y2="120" stroke="currentColor" stroke-width="1" opacity="0.25"/>
  <text x="280" y="140" text-anchor="middle" font-size="10.5" fill="currentColor">coerceToType → typed appender</text>
  <text x="280" y="158" text-anchor="middle" font-size="10.5" fill="currentColor" opacity="0.75">validation happens ONCE, here</text>

  <!-- wire -->
  <line x1="390" y1="112" x2="516" y2="112" stroke="var(--accent)" stroke-width="2" marker-end="url(#ar-hot)"/>
  <text x="453" y="102" text-anchor="middle" font-size="11" font-weight="600" fill="var(--accent)">Parquet + zstd</text>
  <text x="453" y="130" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.7">28 MB / million</text>

  <!-- worker -->
  <rect x="518" y="24" width="374" height="212" rx="5" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <text x="705" y="16" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.65" letter-spacing="0.08em">CONSUMER — the only stateful tier</text>
  <text x="705" y="48" text-anchor="middle" font-size="13" font-weight="600" fill="currentColor">qpl-worker (~64 GB)</text>
  <text x="705" y="68" text-anchor="middle" font-size="10.5" fill="currentColor" opacity="0.75">receives every payload's bytes</text>

  <rect x="540" y="84" width="330" height="60" rx="4" fill="none" stroke="var(--accent)" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="705" y="106" text-anchor="middle" font-size="11.5" font-weight="600" fill="var(--accent)">THE DECISION</text>
  <text x="705" y="126" text-anchor="middle" font-size="10.5" fill="currentColor">append · land the bytes · land then materialise</text>

  <line x1="705" y1="144" x2="705" y2="166" stroke="currentColor" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="560" y="168" width="290" height="52" rx="4" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.55"/>
  <text x="705" y="190" text-anchor="middle" font-size="11.5" fill="currentColor">SQL: filter · project · aggregate · JOIN</text>
  <text x="705" y="208" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.6">joins execute HERE, never in the api-server</text>
</svg>
<figcaption>Records become columnar exactly once, on the producer. The wire carries Parquet, so the worker does zero coercion — which is why the only open question is what the worker does with bytes it already holds.</figcaption>
</figure>

<!-- DIAGRAM 2: the three options, drawn as the DIFFERENCE between them -->
<figure class="fig">
<svg viewBox="0 0 900 320" role="img" aria-label="Three worker options compared: appending decodes and re-encodes every payload into one table; landing the bytes is a verbatim copy queried as a Parquet view; landing then materialising pays one rewrite at the end. The decode step is what separates them." xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <polygon points="0,0 10,5 0,10" fill="currentColor"/>
    </marker>
    <marker id="ar2-hot" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <polygon points="0,0 10,5 0,10" fill="var(--accent)"/>
    </marker>
  </defs>

  <!-- shared payload source -->
  <text x="14" y="20" font-size="11" fill="currentColor" opacity="0.65" letter-spacing="0.08em">PAYLOADS IN HAND</text>
  <g opacity="0.75">
    <rect x="14" y="30" width="26" height="34" rx="3" fill="none" stroke="currentColor" stroke-width="1.3"/>
    <rect x="44" y="30" width="26" height="34" rx="3" fill="none" stroke="currentColor" stroke-width="1.3"/>
    <rect x="74" y="30" width="26" height="34" rx="3" fill="none" stroke="currentColor" stroke-width="1.3"/>
    <text x="110" y="52" font-size="10" fill="currentColor" opacity="0.7">× N</text>
  </g>

  <!-- ROW A -->
  <text x="14" y="106" font-size="12" font-weight="600" fill="currentColor">A · append</text>
  <line x1="120" y1="100" x2="196" y2="100" stroke="var(--accent)" stroke-width="2" marker-end="url(#ar2-hot)"/>
  <text x="158" y="92" text-anchor="middle" font-size="10" font-weight="600" fill="var(--accent)">decode</text>
  <rect x="198" y="80" width="132" height="40" rx="4" fill="none" stroke="currentColor" stroke-width="1.4"/>
  <text x="264" y="105" text-anchor="middle" font-size="11" fill="currentColor">INSERT BY NAME</text>
  <line x1="330" y1="100" x2="392" y2="100" stroke="currentColor" stroke-width="1.5" marker-end="url(#ar2)"/>
  <rect x="394" y="80" width="120" height="40" rx="4" fill="none" stroke="currentColor" stroke-width="1.6"/>
  <text x="454" y="105" text-anchor="middle" font-size="11" font-weight="600" fill="currentColor">one table</text>
  <text x="536" y="97" font-size="10.5" fill="currentColor" opacity="0.8">per-STATEMENT cost, paid N times</text>
  <text x="536" y="113" font-size="10.5" fill="currentColor" opacity="0.8">table is queryable only after the last append</text>

  <!-- ROW B -->
  <text x="14" y="186" font-size="12" font-weight="600" fill="currentColor">B · land</text>
  <line x1="120" y1="180" x2="392" y2="180" stroke="currentColor" stroke-width="1.5" marker-end="url(#ar2)"/>
  <text x="256" y="172" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.8">byte copy — nothing is decoded</text>
  <rect x="394" y="160" width="120" height="40" rx="4" fill="none" stroke="currentColor" stroke-width="1.6"/>
  <text x="454" y="185" text-anchor="middle" font-size="11" font-weight="600" fill="currentColor">parquet view</text>
  <text x="536" y="177" font-size="10.5" fill="currentColor" opacity="0.8">ingest ≈ free; queryable immediately</text>
  <text x="536" y="193" font-size="10.5" fill="currentColor" opacity="0.8">pays a per-ROW-GROUP tax on every query</text>

  <!-- ROW C -->
  <text x="14" y="266" font-size="12" font-weight="600" fill="currentColor">C · land, then</text>
  <text x="14" y="280" font-size="12" font-weight="600" fill="currentColor">materialise</text>
  <line x1="120" y1="260" x2="196" y2="260" stroke="currentColor" stroke-width="1.5" marker-end="url(#ar2)"/>
  <text x="158" y="252" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.8">copy</text>
  <rect x="198" y="240" width="132" height="40" rx="4" fill="none" stroke="currentColor" stroke-width="1.4" opacity="0.7"/>
  <text x="264" y="265" text-anchor="middle" font-size="11" fill="currentColor">landed bytes</text>
  <line x1="330" y1="260" x2="392" y2="260" stroke="var(--accent)" stroke-width="2" marker-end="url(#ar2-hot)"/>
  <text x="361" y="252" text-anchor="middle" font-size="10" font-weight="600" fill="var(--accent)">ONE</text>
  <text x="361" y="278" text-anchor="middle" font-size="9.5" fill="var(--accent)">rewrite</text>
  <rect x="394" y="240" width="120" height="40" rx="4" fill="none" stroke="currentColor" stroke-width="1.6"/>
  <text x="454" y="265" text-anchor="middle" font-size="11" font-weight="600" fill="currentColor">one table</text>
  <text x="536" y="257" font-size="10.5" fill="currentColor" opacity="0.8">B's ingest, A's query cost</text>
  <text x="536" y="273" font-size="10.5" fill="currentColor" opacity="0.8">the rewrite is deferred to quiesce, and paid once</text>
</svg>
<figcaption>The three options differ in exactly one place: where — and how many times — bytes are decoded and re-encoded. A pays it per payload, C pays it once, B never pays it and settles up per query instead.</figcaption>
</figure>

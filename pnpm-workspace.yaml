allowBuilds:
  '@confluentinc/kafka-javascript': true
  '@parcel/watcher': true
  '@swc/core': true
  dtrace-provider: true
  esbuild: true
  protobufjs: true
  teraslice-cli: true
  unrs-resolver: true
  xlucene-parser: true

publicHoistPattern:
  - "@terascope/scripts"

blockExoticSubdeps: true

minimumReleaseAge: 1440 # 1 day

minimumReleaseAgeExclude:
  - '@terascope/*'
  - elasticsearch-store
  - terafoundation
  - terafoundation_kafka_connector
  - teraslice
  - teraslice-cli
  - teraslice-client-js
  - teraslice-test-harness
  - ts-transforms
  - xlucene-parser
  - xlucene-translator
  - xpressions

trustPolicy: no-downgrade

trustPolicyExclude:
  - 'semver@6.3.1' # false positive - maintainer change

